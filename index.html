      try {
        var p = location.pathname;
        if (p === '/install' || p === '/install/') {
          var l = document.querySelector('link[rel="manifest"]');
          if (l) l.setAttribute('href', '/manifest-admin.json');
          var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');

    })();

  <script>
    // Earliest chunk error recovery — before React loads
    (function(){
      var k='chunk_reload';
      function isChunk(m){return m&&(m.indexOf('dynamically imported')>-1||m.indexOf('module script failed')>-1||m.indexOf('Loading chunk')>-1||m.indexOf('ChunkLoadError')>-1||m.indexOf('Loading CSS chunk')>-1)}
      function tryReload(){var l=sessionStorage.getItem(k),n=Date.now();if(!l||n-Number(l)>10000){sessionStorage.setItem(k,String(n));location.reload()}}
      window.addEventListener('error',function(e){if(isChunk(e.message||''))tryReload()});
      window.addEventListener('unhandledrejection',function(e){var r=e.reason;if(isChunk(r&&(r.message||String(r))||''))tryReload()});
    })();
  </script>
